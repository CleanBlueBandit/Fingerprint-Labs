<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <main class="card">
        <h1>Dashboard</h1>
        <p id="welcome" class="lead">Loading...</p>
        <p id="since" class="muted"></p>
        <div class="actions">
            <a class="button" href="/fingerprint">Browser fingerprint test</a>
            <a class="button secondary" href="/history">My saved fingerprints</a>
            <button id="logout" type="button" class="secondary">Log out</button>
        </div>
        <p id="message" class="message" role="alert"></p>
    </main>

    <script src="/src/dashboard.js"></script>
</body>
</html>
